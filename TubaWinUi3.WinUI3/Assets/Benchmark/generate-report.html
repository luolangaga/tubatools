<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Performance Report</title>
<style>
@page{size:A4;margin:15mm 18mm}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;color:#1a1a1a;font-size:11px;line-height:1.5;background:#f4f7fb;padding:24px 32px}
.header{border-bottom:2px solid #3b7dd8;padding-bottom:10px;margin-bottom:16px}
.header h1{font-size:20px;color:#1e4a7a;margin-bottom:4px;font-weight:700}
.header .meta{font-size:10px;color:#5a7a9a}
.header .meta span{margin-right:20px}
.section{margin-bottom:18px;background:#fff;border:1px solid #d0dde8;padding:14px 16px}
.section-title{font-size:13px;font-weight:700;color:#1e4a7a;border-bottom:1px solid #d0dde8;padding-bottom:4px;margin-bottom:10px}
.cards{display:flex;gap:16px;margin-bottom:12px}
.card{flex:1;border:1px solid #d0dde8;padding:12px 14px;background:#edf3fa}
.card .label{font-size:10px;color:#5a7a9a;margin-bottom:2px}
.card .score{font-size:26px;font-weight:700}
.card .grade{font-size:16px;font-weight:700;margin-left:8px}
.card .bar-bg{height:5px;background:#d0dde8;margin-top:5px}
.card .bar-fill{height:100%}
.s-green{color:#2e7d32}.s-blue{color:#1e4a7a}.s-yellow{color:#8a6d0b}.s-orange{color:#c45800}.s-red{color:#b71c1c}
.b-green{background:#2e7d32}.b-blue{background:#1e4a7a}.b-yellow{background:#8a6d0b}.b-orange{background:#c45800}.b-red{background:#b71c1c}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:4px 8px;border-bottom:1px solid #e8eef4;font-size:10.5px}
th{color:#5a7a9a;font-weight:400;width:110px}
td.score-col{font-weight:700;width:60px}
td.detail-col{color:#5a7a9a;font-size:10px}
.heatmap-img{margin:8px 0;max-width:100%}
.footer{margin-top:20px;font-size:9px;color:#8aa0b8;border-top:1px solid #d0dde8;padding-top:6px;text-align:center}
.watermark{position:fixed;bottom:40px;right:40px;font-size:42px;color:rgba(30,74,122,0.06);font-weight:900;pointer-events:none;z-index:9999;letter-spacing:2px;transform:rotate(-15deg)}
.watermark-banner{position:fixed;bottom:20px;left:0;right:0;text-align:center;font-size:9px;color:rgba(30,74,122,0.15);pointer-events:none;z-index:9999}
.page-break{page-break-before:always}
</style></head>

h+='<div class="card"><div class="label">办公性能</div><div><span class="score s-'+gc(d.officeGrade)+'">'+d.officeScore+'</span><span class="grade s-'+gc(d.officeGrade)+'">'+d.officeGrade+'</span></div>'+bar(d.officeScore)+'</div>';
h+='</div>';

h+='<div style="display:flex;justify-content:center;margin:12px 0">';
var rl=['CPU单核','CPU多核','GPU渲染','内存','硬盘读','硬盘写','4K读','4K写','浏览器'];
var rv=[d.cpu.singleCoreScore,d.cpu.multiCoreScore,d.gpu.renderScore,d.memory.capacityScore,d.disk.seqReadScore,d.disk.seqWriteScore,d.disk.random4KReadScore,d.disk.random4KWriteScore,d.browser.totalScore];
var rn=rl.length,rcx=160,rcy=160,rr=120;
var rmx=Math.max.apply(null,rv.concat([1]));
var rgrid=[],rpts=[];
for(var ri=0;ri<rn;ri++){
  var ra=-Math.PI/2+2*Math.PI*ri/rn;
  var rco=Math.cos(ra),rsi=Math.sin(ra);
  var rrv=rv[ri]/rmx*rr;
  rpts.push((rcx+rrv*rco).toFixed(1)+','+(rcy+rrv*rsi).toFixed(1));
  var rlx=rcx+(rr+18)*rco,rly=rcy+(rr+18)*rsi;
  rgrid.push("<text x='"+rlx.toFixed(0)+"' y='"+rly.toFixed(0)+"' text-anchor='middle' dominant-baseline='middle' font-size='9' fill='#5a7a9a'>"+rl[ri]+"</text>");
  for(var rg=0.25;rg<=1.0;rg+=0.25){
    rgrid.push("<circle cx='"+rcx+"' cy='"+rcy+"' r='"+(rr*rg).toFixed(0)+"' fill='none' stroke='#d0dde8' stroke-width='0.5'/>");
  }
  rgrid.push("<line x1='"+rcx+"' y1='"+rcy+"' x2='"+(rcx+rr*rco).toFixed(1)+"' y2='"+(rcy+rr*rsi).toFixed(1)+"' stroke='#d0dde8' stroke-width='0.5'/>");
}
h+='<svg width="340" height="340" viewBox="0 0 340 340">'+rgrid.join('\n')+'<polygon points="'+rpts.join(' ')+'" fill="rgba(59,125,216,0.25)" stroke="#3b7dd8" stroke-width="1.5"/></svg>';
h+='</div>';

h+='</div>';

h+='<div class="section">';
h+='<div class="section-title">CPU 性能</div>';
h+='<table>';
h+='<tr><th>单核</th><td class="score-col">'+scoreSpan(d.cpu.singleCoreScore)+'</td><td class="detail-col">CPU-Z '+d.cpu.singleCoreIterations+' 分</td></tr>';
h+='<tr><th>多核</th><td class="score-col">'+scoreSpan(d.cpu.multiCoreScore)+'</td><td class="detail-col">CPU-Z '+d.cpu.multiCoreIterations+' 分</td></tr>';
h+='<tr><th>核间延迟</th><td class="score-col">'+scoreSpan(d.cpu.latencyScore)+'</td><td class="detail-col">'+(d.cpu.latencyMatrix?d.cpu.latencyMatrix.averageNs.toFixed(1)+'ns 平均':'N/A')+'</td></tr>';
h+='</table>';

if(d.cpu.latencyMatrix&&d.cpu.latencyMatrix.coreCount>1){
  var lm=d.cpu.latencyMatrix;
  if(lm.heatmapBase64){
    h+='<img class="heatmap-img" src="data:image/png;base64,'+lm.heatmapBase64+'" />';
  }
  h+='<div style="font-size:9px;color:#5a7a9a;margin-top:4px">平均:'+lm.averageNs.toFixed(1)+'ns  最小:'+lm.minNs.toFixed(1)+'ns  最大:'+lm.maxNs.toFixed(1)+'ns</div>';
}
h+='</div>';

h+='<div class="page-break"></div>';

h+='<div class="section">';
h+='<div class="section-title">GPU 性能</div>';
if(d.gpu.gpuName) h+='<div class="meta">受测显卡：'+escapeText(d.gpu.gpuName)+'</div>';
h+='<table>';
h+='<tr><th>渲染性能</th><td class="score-col">'+scoreSpan(d.gpu.renderScore)+'</td><td class="detail-col">FurMark '+d.gpu.furMarkScore+' 分</td></tr>';
h+='<tr><th>平均帧率</th><td class="score-col">-</td><td class="detail-col">'+d.gpu.avgFps.toFixed(1)+' FPS</td></tr>';
h+='<tr><th>帧率范围</th><td class="score-col">-</td><td class="detail-col">'+d.gpu.minFps.toFixed(1)+' ~ '+d.gpu.maxFps.toFixed(1)+' FPS</td></tr>';
h+='</table></div>';

h+='<div class="section">';
h+='<div class="section-title">内存性能</div>';
h+='<table>';
h+='<tr><th>容量</th><td class="score-col">'+scoreSpan(d.memory.capacityScore)+'</td><td class="detail-col">'+d.memory.totalCapacityGB.toFixed(0)+' GB</td></tr>';
h+='</table></div>';

h+='<div class="section">';
h+='<div class="section-title">硬盘性能</div>';
h+='<table>';
h+='<tr><th>顺序读取</th><td class="score-col">'+scoreSpan(d.disk.seqReadScore)+'</td><td class="detail-col">'+d.disk.seqReadMBs.toFixed(0)+' MB/s</td></tr>';
h+='<tr><th>顺序写入</th><td class="score-col">'+scoreSpan(d.disk.seqWriteScore)+'</td><td class="detail-col">'+d.disk.seqWriteMBs.toFixed(0)+' MB/s</td></tr>';
h+='<tr><th>4K随机读</th><td class="score-col">'+scoreSpan(d.disk.random4KReadScore)+'</td><td class="detail-col">'+(d.disk.random4KReadIops/1000).toFixed(0)+'K IOPS</td></tr>';
h+='<tr><th>4K随机写</th><td class="score-col">'+scoreSpan(d.disk.random4KWriteScore)+'</td><td class="detail-col">'+(d.disk.random4KWriteIops/1000).toFixed(0)+'K IOPS</td></tr>';
h+='<tr><th>温度</th><td class="score-col">'+scoreSpan(d.disk.tempScore)+'</td><td class="detail-col">'+d.disk.temperature.toFixed(0)+' C</td></tr>';
h+='</table></div>';

h+='<div class="section">';
h+='<div class="section-title">浏览器流畅度</div>';
h+='<table>';
h+='<tr><th>JS 引擎</th><td class="score-col">'+scoreSpan(d.browser.jsScore)+'</td><td class="detail-col">'+d.browser.jsScore+'</td></tr>';
h+='<tr><th>DOM 表格</th><td class="score-col">'+scoreSpan(d.browser.domScore)+'</td><td class="detail-col">'+d.browser.domScore+'</td></tr>';
h+='<tr><th>DOM 卡片</th><td class="score-col">'+scoreSpan(d.browser.cardScore)+'</td><td class="detail-col">'+d.browser.cardScore+'</td></tr>';
h+='<tr><th>CSS 动画</th><td class="score-col">'+scoreSpan(d.browser.cssScore)+'</td><td class="detail-col">'+d.browser.cssScore+'</td></tr>';
h+='<tr><th>布局重排</th><td class="score-col">'+scoreSpan(d.browser.layoutScore)+'</td><td class="detail-col">'+d.browser.layoutScore+'</td></tr>';
h+='<tr><th>事件处理</th><td class="score-col">'+scoreSpan(d.browser.eventScore)+'</td><td class="detail-col">'+d.browser.eventScore+'</td></tr>';
h+='<tr><th>浏览器总分</th><td class="score-col">'+scoreSpan(d.browser.totalScore)+'</td><td class="detail-col"></td></tr>';
h+='</table></div>';

h+='<div class="section">';
h+='<div class="section-title">权重说明</div>';
h+='<div style="font-size:9px;color:#5a7a9a;line-height:1.7">';
h+='<div>各项基准分=100分，不设上限。游戏性能 = CPU单核x25% + CPU多核x10% + GPU渲染x35% + 内存容量x5% + 硬盘顺读x5% + 硬盘顺写x3% + 硬盘4K读x5% + 硬盘4K写x2% + 浏览器x10%</div>';
h+='<div>办公性能 = CPU单核x20% + CPU多核x5% + GPU渲染x5% + 内存容量x12% + 硬盘顺读x10% + 硬盘顺写x8% + 硬盘4K读x6% + 硬盘4K写x5% + 浏览器x29%</div>';
h+='</div></div>';

h+='<div class="footer">图吧工具箱CE v'+d.appVersion+'    报告生成: '+new Date().toLocaleString('zh-CN')+'</div>';

document.getElementById('report').innerHTML=h;
window.chrome.webview.postMessage(JSON.stringify({type:'report_ready'}));
};

if(window.REPORT_DATA)window.renderReport();
</script></body></html>
