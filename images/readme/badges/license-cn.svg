<svg xmlns="http://www.w3.org/2000/svg" width="100" height="20" viewBox="0 0 100 20" role="img" aria-label="许可证：GPL-3.0">
  <title>许可证：GPL-3.0</title>
  <style>
    svg { --label-bg:#5b624a; --label-ink:#ffffff; --value-bg:#a8d6d9; --value-ink:#333333; }
    @media (prefers-color-scheme: dark) { svg { --value-bg:#2f4b4e; --value-ink:#e3f1f2; } }
  </style>
  <g shape-rendering="crispEdges">
    <rect width="46" height="20" fill="var(--label-bg)"/>
    <rect x="46" width="54" height="20" fill="var(--value-bg)"/>
  </g>
  <g fill="var(--label-ink)" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,Microsoft YaHei,PingFang SC,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <text x="230" y="140" textLength="360" transform="scale(.1)">许可证</text>
    <text x="730" y="140" textLength="440" transform="scale(.1)" fill="var(--value-ink)">GPL-3.0</text>
  </g>
</svg>
