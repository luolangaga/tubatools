name: 测试构建 x64（便携版 + 安装包）

# 手动触发的测试构建：只打包 x64 便携版 zip 和 Inno 安装包，
# 产物以 Actions artifacts 形式下载，不创建 Release、不推送任何内容。
run-name: 测试构建 x64 ${{ inputs.version || '自动版本' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: '测试版本号（例如 1.0.3-test，留空自动生成 0.0.0-test.N）'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  AxiomIngestToken: ${{ secrets.AXIOM_INGEST_TOKEN }}

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  build-test-x64:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve test version
        id: ver
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $ver = "0.0.0-test.$env:GITHUB_RUN_NUMBER"
          }
          Write-Host "Test version: $ver"
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Update version in .csproj and .iss files
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"

          $csproj = Get-Content -LiteralPath 'TubaWinUi3.WinUI3/TubaWinUi3.csproj' -Raw
          $csproj = $csproj -replace '<Version>[^<]*</Version>', "<Version>$ver</Version>"
          Set-Content -LiteralPath 'TubaWinUi3.WinUI3/TubaWinUi3.csproj' -Value $csproj -NoNewline

          $iss = Get-Content -LiteralPath 'installer-x64.iss' -Raw
          $iss = $iss -replace '#define MyAppVersion "[^"]*"', "#define MyAppVersion ""$ver"""
          Set-Content -LiteralPath 'installer-x64.iss' -Value $iss -NoNewline

          Write-Host "Version updated to $ver"

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.400
            8.0.x

      - name: Setup fonttools (build-time font subsetting)
        run: pip install fonttools

      - name: Publish app (portable)
        run: |
          dotnet publish TubaWinUi3.WinUI3/TubaWinUi3.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:WindowsAppSDKSelfContained=true `
            -p:WindowsPackageType=None `
            -o publish_x64

      - name: Restore .pri file for portable
        shell: pwsh
        run: |
          $priFile = "TubaWinUi3.WinUI3\bin\x64\Release\net10.0-windows10.0.26100.0\win-x64\TubaWinUi3.pri"
          if (Test-Path -LiteralPath $priFile) {
            Copy-Item -LiteralPath $priFile -Destination publish_x64 -Force
            Write-Host "Restored TubaWinUi3.pri for portable"
          } else {
            Write-Host "::warning::TubaWinUi3.pri not found at $priFile"
          }

      - name: Publish app (for installer)
        run: |
          dotnet publish TubaWinUi3.WinUI3/TubaWinUi3.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:WindowsAppSDKSelfContained=true `
            -p:WindowsPackageType=None `
            -o publish_x64_installer

      - name: Restore .pri file for installer
        shell: pwsh
        run: |
          $priFile = "TubaWinUi3.WinUI3\bin\x64\Release\net10.0-windows10.0.26100.0\win-x64\TubaWinUi3.pri"
          if (Test-Path -LiteralPath $priFile) {
            Copy-Item -LiteralPath $priFile -Destination publish_x64_installer -Force
            Write-Host "Restored TubaWinUi3.pri for installer"
          }
          New-Item -ItemType File -Path (Join-Path 'publish_x64_installer' '.installed') -Force | Out-Null

      - name: Clean up publish directories
        shell: pwsh
        run: |
          foreach ($root in @('publish_x64', 'publish_x64_installer')) {
            Get-ChildItem -LiteralPath $root -Filter '*.pdb' -Recurse -Force -ErrorAction SilentlyContinue |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }

      - name: Publish TUI compatibility edition (Native AOT)
        shell: pwsh
        run: |
          dotnet publish TubaWinUi3.Tui/TubaWinUi3.Tui.csproj `
            -c Release `
            -r win-x64 `
            -p:Version=${{ steps.ver.outputs.version }} `
            -o publish_tui_x64
          $tuiExe = "publish_tui_x64/图吧工具箱TUI兼容版.exe"
          if ($LASTEXITCODE -ne 0) { throw "Native AOT publish failed ($LASTEXITCODE)" }
          if (-not (Test-Path -LiteralPath $tuiExe -PathType Leaf)) { throw "Missing TUI executable: $tuiExe" }
          & (Join-Path $PWD $tuiExe) --version
          if ($LASTEXITCODE -ne 0) { throw "Native TUI smoke test failed ($LASTEXITCODE)" }

      - name: Build Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
        with:
          path: installer-x64.iss

      - name: Create portable zip (src/ layout with launcher)
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $stagingDir = 'portable_staging_x64'
          $srcDir = Join-Path $stagingDir 'src'

          if (Test-Path -LiteralPath $stagingDir) { Remove-Item -LiteralPath $stagingDir -Recurse -Force }
          New-Item -ItemType Directory -Path $srcDir -Force | Out-Null

          Get-ChildItem -LiteralPath 'publish_x64' | Where-Object { $_.Extension -ne '.pdb' -and $_.Name -ne '.installed' } | Move-Item -Destination $srcDir -Force

          Copy-Item -LiteralPath "Launcher\bin\图吧工具箱WinUI3_x64.exe" -Destination (Join-Path $stagingDir '图吧工具箱WinUI3.exe') -Force

          $tuiExe = "publish_tui_x64/图吧工具箱TUI兼容版.exe"
          Copy-Item -LiteralPath $tuiExe -Destination (Join-Path $stagingDir '图吧工具箱TUI兼容版.exe') -Force

          Compress-Archive -Path "$stagingDir\*" `
            -DestinationPath "TubaWinUi3_Portable_${version}_x64.zip"

          $size = [math]::Round((Get-Item "TubaWinUi3_Portable_${version}_x64.zip").Length / 1MB, 1)
          Write-Host "Portable zip size: $size MB"
          $setup = Get-ChildItem -LiteralPath 'SetupOutput' -Filter 'TubaWinUi3_Setup_*_x64.exe' | Select-Object -First 1
          if ($setup) {
            $setupSize = [math]::Round($setup.Length / 1MB, 1)
            Write-Host "Installer size: $setupSize MB ($($setup.Name))"
          } else {
            Write-Host '::error::Inno Setup output not found in SetupOutput'
            exit 1
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-x64-test
          path: SetupOutput\TubaWinUi3_Setup_*_x64.exe
          if-no-files-found: error

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: portable-x64-test
          path: TubaWinUi3_Portable_${{ steps.ver.outputs.version }}_x64.zip
          if-no-files-found: error
