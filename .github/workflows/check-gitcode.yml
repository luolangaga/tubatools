name: Check GitCode Repo
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query GitCode API
        env:
          TOKEN: ${{ secrets.GITCODE_ACCESS_TOKEN }}
        run: |
          for base in https://api.atomgit.com/api/v5 https://api.gitcode.com/api/v5; do
            echo "===== $base ====="
            echo "--- repo ---"
            curl -sS "$base/repos/luolangaga/tubatool?access_token=$TOKEN" | head -c 2500; echo
            echo "--- releases ---"
            curl -sS "$base/repos/luolangaga/tubatool/releases?per_page=3&access_token=$TOKEN" | head -c 2500; echo
            echo "--- tag v1.9.0 status ---"
            curl -sS -o /dev/null -w "%{http_code}\n" "$base/repos/luolangaga/tubatool/tags/v1.9.0?access_token=$TOKEN" || true
            echo "--- create release dry (no body) ---"
            curl -sS -X POST "$base/repos/luolangaga/tubatool/releases?access_token=$TOKEN" \
              -H 'Content-Type: application/json' \
              -d '{"tag_name":"v1.9.0-diagnostic","name":"diagnostic","body":"diagnostic","target_commitish":"master","release_status":"pre"}' | head -c 1500; echo
          done
